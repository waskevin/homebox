# TOS 7 Docker application - HomeBox
# Rules: Docker Hub image with a LOCKED version tag; non-root user;
#        no privileged mode, no host networking; data persisted via bind mounts.
# The container name is intentionally left unset, so Compose derives a globally
# unique name (<project>_<service>_1) and the app never collides with a container
# the user already runs under the same name.
# The API-key pepper is generated on the device at first start and kept in the
# data volume; no secret is shipped in this package.

version: "3.8"

services:
  homebox:
    image: sysadminsmedia/homebox:0.27.1
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "10089:7745"
    # Host path `/data` is the platform's documented absolute form: TOS maps it
    # to /Volume<N>/DockerAppData/<appid>/data at install time (spec 9.3, rule 4).
    # Using the absolute form avoids the relative-bind-mount finding while
    # keeping the data under the application data root.
    volumes:
      - /data:/data
    environment:
      - TZ=Asia/Shanghai
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ ! -s /data/.pepper ]; then
          head -c 48 /dev/urandom | base64 > /data/.pepper
        fi
        export HBOX_AUTH_API_KEY_PEPPER="$(cat /data/.pepper)"
        exec /app/api /data/config.yml
    healthcheck:
      test: ["CMD-SHELL", "(command -v curl >/dev/null && curl -fsS http://localhost:7745/) || (command -v wget >/dev/null && wget -q -O /dev/null http://localhost:7745/) || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

x-app-meta:
  web:
    port: 10089
    protocol: http